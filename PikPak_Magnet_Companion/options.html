<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PikPak Magnet Companion</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="panel">
    <header>
      <div class="brand"><img src="icons/icon-48.png" alt=""><h1 data-i18n="extensionTitle">PikPak Magnet Companion</h1></div>
      <p data-i18n="subtitle">Used with the PikPak Enhancement Master userscript: forwards magnets selected on any webpage to an open PikPak page running the main script. The companion cannot parse, preview, or save magnets by itself.</p>
    </header>

    <section class="section language-section">
      <label for="language"><span id="languageLabel">Language</span></label>
      <select id="language">
        <option value="zh">简体中文</option>
        <option value="tc">繁體中文</option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
        <option value="id">Indonesia</option>
        <option value="ms">Bahasa Melayu</option>
      </select>
    </section>

    <section class="section">
      <h2 data-i18n="selectionTitle">Selected magnet behavior</h2>
      <label class="choice">
        <input type="radio" name="selectionMode" value="confirm">
        <span><strong data-i18n="confirmTitle">Confirm before sending (Recommended)</strong><small data-i18n="confirmDesc">Show a button after selecting a magnet; switch to PikPak only after clicking it.</small></span>
      </label>
      <label class="choice">
        <input type="radio" name="selectionMode" value="auto">
        <span><strong data-i18n="autoTitle">Send automatically</strong><small data-i18n="autoDesc">Send and switch to PikPak immediately after selecting a magnet.</small></span>
      </label>
      <label class="choice">
        <input type="radio" name="selectionMode" value="off">
        <span><strong data-i18n="offTitle">Disable automatic detection</strong><small data-i18n="offDesc">Do not process selections; keep the context-menu action available.</small></span>
      </label>
    </section>

    <section class="section">
      <h2 data-i18n="shortcutTitle">Quick actions</h2>
      <label class="switch-row">
        <input id="contextMenuEnabled" type="checkbox">
        <span data-i18n="contextMenu">Show the “Send magnet to PikPak” context-menu item</span>
      </label>
      <label class="switch-row">
        <input id="focusPikPakTab" type="checkbox">
        <span data-i18n="focusTab">Switch to the PikPak tab after sending</span>
      </label>
    </section>

    <footer>
      <button id="resetButton" class="secondary" type="button" data-i18n="reset">Restore defaults</button>
      <span id="status" role="status" aria-live="polite"></span>
      <button id="saveButton" class="primary" type="button" data-i18n="save">Save settings</button>
    </footer>
  </main>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
